# Optional: serve Thoth on port 80/443 through nginx while the app stays on 127.0.0.1.
#   sudo cp deploy/nginx-thoth.conf /etc/nginx/sites-available/thoth
#   sudo ln -s /etc/nginx/sites-available/thoth /etc/nginx/sites-enabled/thoth
#   sudo nginx -t && sudo systemctl reload nginx
# For HTTPS, run certbot afterwards:  sudo certbot --nginx -d thoth.example.com
server {
    listen 80;
    server_name thoth.example.com;   # change to your domain or server IP

    location / {
        proxy_pass http://127.0.0.1:3000;  # must match PORT in /etc/thoth/thoth.env
        proxy_http_version 1.1;
        # Keep the original Host so the app's same-origin check passes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Downloading and installing an update can take a while
        proxy_read_timeout 120s;
    }
}
