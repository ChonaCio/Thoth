# Run on a headless server:
#   cp .env.example .env        # set THOTH_MEDIA_DIR to your comics folder
#   docker compose up -d --build
# Open http://<server-ip>:3000 from any device on the network and create the first user,
# then add a library pointing at /media (or a folder inside it).
# Starts again automatically when the server reboots (as long as Docker itself starts on boot).
services:
  thoth:
    build: .
    image: thoth:latest
    container_name: thoth
    restart: unless-stopped
    ports:
      - "${THOTH_PORT:-3000}:3000"
    environment:
      THOTH_UPDATE_REPO: ${THOTH_UPDATE_REPO:-ChonaCio/Thoth}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      # Holds the app files and the data/ folder (users, sessions, settings),
      # so accounts and updates installed from the Updates page persist
      - thoth-app:/app
      # Your comics/manga, read-only: inside the app, add a library with the folder /media
      - ${THOTH_MEDIA_DIR:-./media}:/media:ro

volumes:
  thoth-app:
